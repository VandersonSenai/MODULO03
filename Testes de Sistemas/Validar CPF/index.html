<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Desenvolva uma função que determine se um número é primo ou não. 
     Retorne true se for primo e false se não for. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número é primo ou não</title>
    <script>
        function verificaCPF(){
            // https://calculadoradev.com.br/validadores/cpf
            var numero = document.getElementById(`numero`).value;
            var resultado = document.getElementById('resultado');

            var cpfTeste = String(numero).replace(/[^\d]/g,'')
            // var cpfTeste = String(numero).replace(/[^\d]/g, '')
            // var cpfTeste = "11144477735"
            var cpfTeste2 = "11144477738"
            var verificador = [];
            var cpfValido = new Boolean(true)
            var msgValidacao = "";

            console.log("teste - " + cpfTeste);
            
            if ([
                '00000000000',
                '11111111111',
                '22222222222',
                '33333333333',
                '44444444444',
                '55555555555',
                '66666666666',
                '77777777777',
                '88888888888',
                '99999999999',
                ].indexOf(cpfTeste) !== -1){
                    cpfValido = false;
                    msgValidacao = "Erro: Sequencia de números invalida";
                }
        

            if (isNaN(cpfTeste) && cpfValido ) {
                msgValidacao = 'Erro: CPF deve possuir apenas números'
                cpfValido = false;
                
            } else if ( (cpfTeste.length !== 11) && cpfValido ){
                msgValidacao = 'Erro: Numero dígitos incorretos';
                cpfValido = false;
            } 

            for (var x = 0 ; x <=1 ; x++){
                for (var i = 10+x ; i>=2 ; i--){
                    verificador[x] = verificador[x] +  parseInt(cpfTeste.substring((x+10)-i, (x+11)-i)*(i));
                }
            }
            for (var x = 0 ; x <=1 ; x++) {
                if (verificador[x]%11<2){
                    verificador[x]=0;
                } else {
                    verificador[x] = (11-(verificador[x]%11));
                }
            }

            if (cpfValido == true){

                if ( (cpfTeste.substring(9, 10) == verificador[0]) && (cpfTeste.substring(10, 11) == verificador[1])){
                    resultado.innerHTML = "CPF VALIDO !!!";
                } 
            } else {
                    resultado.innerHTML = msgValidacao;
                }
        }

        
    </script>
</head>
<body>

    <div align="Center">
    <h1>
        Validador de CPF
    </h1>
    <label for="numero"></label>
    <input type="text" id="numero" name="numero" />
    <button onclick="verificaCPF()">Verificar</button>
    <p><span id="resultado"></span></p>
    </div>  
    </br>
    
</body>
</html>
