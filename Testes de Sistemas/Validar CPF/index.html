<head>
    <!-- Desenvolva uma função que determine se um número é primo ou não. 
     Retorne true se for primo e false se não for. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número é primo ou não</title>
    <script>

        function verificaCPF(){
            // https://calculadoradev.com.br/validadores/cpf
            var numero = document.getElementById(`numero`).value;
            var resultado = document.getElementById('resultado');
            // Regex que remover qualquer caracter que nao seja numero.
            // var cpfTeste = String(numero).replace(/[^\d]/g,'');
            var cpfTeste = numero;
            var verificador = [0,0];
            var cpfValido = new Boolean(true)
            var msgValidacao = "🚨 CPF inválido. 🚨";


            if ((cpfTeste==null) || (cpfTeste.length==0) || (cpfTeste=="") ){
                cpfValido = false;
                msgValidacao = "Atenção: 🚨 Obrigatório fornecer um numero de CPF. 🚨";
            }

            if (!(isNaN(cpfTeste)) && (cpfValido) ){
                for (x = 0 ; x<=9 ; x++){
                    var verificaSequencia = "";
                    for (y = 0 ; y<=10 ; y++){
                        verificaSequencia = verificaSequencia + x;
                    }
                    if ( verificaSequencia == cpfTeste ) {
                        cpfValido = false;
                        msgValidacao = "Atenção: 🚨 Sequencia de números invalida. 🚨";
                    }
                } 
            }
            
            // Verifica se o CPF possui apenas numero
            if (isNaN(cpfTeste) && cpfValido ) {
                msgValidacao = 'Atenção: 🚨 CPF deve possuir apenas números. 🚨'
                cpfValido = false;
                // Verifica se o CPF possui os 11 numeros obrigatórios
            } else if ( (cpfTeste.length != 11) && cpfValido ){
                msgValidacao = 'Atenção: 🚨 Insira os 11 dígitos do CPF. 🚨';
                cpfValido = false;
            } 

            // Processa o numero identificando os numeros verificadores
            for (var x = 0 ; x <=1 ; x++){
                for (var i = 10+x ; i>=2 ; i--){
                    verificador[x] = verificador[x] +  parseInt(cpfTeste.substring((x+10)-i, (x+11)-i)*(i));
                }
            }

            for (var x = 0 ; x <=1 ; x++) {
                if (verificador[x]%11<2){
                    verificador[x]=0;
                } else {
                    verificador[x] = (11-(verificador[x]%11));
                }
            }

            if ( (cpfValido == true) && (cpfTeste.substring(9, 10) == verificador[0]) && (cpfTeste.substring(10, 11) == verificador[1])){
                    resultado.innerHTML = "( ͡° ͜ʖ ͡°)  🟢 CPF válido 🟢";
                } else {
                    resultado.innerHTML = msgValidacao;
                }
        }    
    </script>
</head>
<body>

    <div align="Center">
    <h1>
        Verificador de CPF
    </h1>
    <label for="numero"></label>
    <input type="text" id="numero" name="numero" maxlength="11"/>
    <!-- Input com mascara de entrada ao carregar a funcao formatar('###.###.###-##',this) -->
    <!-- <input type="text" id="numero" name="numero" maxlength="14" OnKeyPress="formatar('###.###.###-##',this)"/> -->
    <button onclick="verificaCPF()">Verificar</button>
    <p><span id="resultado"></span></p>
    </div>

</body>
